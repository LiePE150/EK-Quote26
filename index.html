:'Nächste Aufgabe'} →</button><span class="points">${score} / 10 Punkte</span></div>`;counter.textContent=`Aufgabe ${index+1} von 5 · ${score} / 10 Punkte`}function next(){selected=null;index++;render()}function finish(){bar.style.width='100%';counter.textContent='Quiz abgeschlossen';let rank=score===10?'🏆 Finanzprofi':score>=8?'🥇 Bilanz-Ass':score>=6?'🥈 Kapital-Kenner':score>=4?'🥉 Aufsteiger':'🌱 Nachwuchs-Talent';app.innerHTML=`<div class="eyebrow">Dein Ergebnis</div><h1>${score} von 10 Punkten</h1><div class="rank">${rank}</div><p class="lead">${score===10?'Stark! Du hast alle Aussagen richtig beurteilt.':score>=6?'Gut gemacht! Schau dir die Erklärungen zu deinen Fehlern noch einmal an.':'Du hast einen Anfang gemacht! Wiederhole die Eigenkapitalquote und versuche es erneut.'}</p><div class="results">${answers.map((v,i)=>`<div class="result-cell ${v?'good':'bad'}">${i+1}<br>${v?'✓ +2':'✕ +0'}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="start()">Erneut spielen ↻</button><button class="secondary" onclick="showReview()">Lösungen ansehen</button></div>`}function showReview(){app.innerHTML=`<div class="eyebrow">Lösungsübersicht</div><h2 style="margin:10px 0 16px">Die fünf Aussagen</h2><div style="overflow:auto;max-height:49vh">${questions.map((q,i)=>`<div style="padding:10px 0;border-bottom:1px solid #45615e;font-size:clamp(13px,1.15vw,17px)"><b style="color:var(--green)">${i+1}. ${q.correct?'Richtig':'Falsch'}</b> – ${q.why}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="start()">Noch einmal spielen ↻</button></div>`}
render();</script></body></html>
